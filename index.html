<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glor.io Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-layer">
        <div class="resource-bar">
            <div class="resource">🌲 Wood: <span id="wood-count">0</span></div>
            <div class="resource">🪨 Stone: <span id="stone-count">0</span></div>
            <div class="resource">🍎 Food: <span id="food-count">0</span></div>
            <div class="resource">💰 Gold: <span id="gold-count">0</span></div>
            <div class="resource">⭐ Level: <span id="level-count">1</span></div>
            <div class="resource">🔫 Weapon: <span id="weapon-name">Sword</span></div>
        </div>
        <div id="controls-help">
            WASD: Move | Click: Attack | Q: Weapon | F: Mount | 1-4, 7: Build | 5-6: Units
        </div>
        <div id="leaderboard">
            <h3>Leaderboard</h3>
            <ul id="leaderboard-list">
                <!-- Items here -->
            </ul>
        </div>
        <div id="start-screen" class="overlay">
            <h1>Glor.io Clone</h1>
            <p>Gather resources, build a base, and survive!</p>
            <button id="start-btn">Play</button>
        </div>
        <div id="game-over-screen" class="overlay" style="display: none;">
            <h1>Game Over</h1>
            <button id="restart-btn">Restart</button>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script type="module" src="src/main.js"></script>
</body>
</html>
